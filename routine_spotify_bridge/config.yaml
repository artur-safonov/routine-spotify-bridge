name: Routine Spotify Bridge
slug: routine_spotify_bridge
description: Local Spotify Web API bridge for the Routine Controller display
version: "0.1.1"
url: https://github.com/artur-safonov/routine-spotify-bridge/tree/main/routine_spotify_bridge
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
apparmor: false
webui: http://[HOST]:[PORT:8099]
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: OAuth setup and local display API
options:
  client_id: ""
  client_secret: ""
  public_base_url: "http://homeassistant.local:8099"
  bridge_token: ""
  market: "UA"
schema:
  client_id: str
  client_secret: password
  public_base_url: url
  bridge_token: password
  market: str
